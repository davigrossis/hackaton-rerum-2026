    concentrado_receita_nivel: {valor: alto, cf: 1.0}
    custo_alimentar_nivel: {valor: alto, cf: 1.0}
    troca_leite_milho_nivel: {valor: desfavoravel, cf: 1.0}
    qualidade_leite: {valor: fora_in76, cf: 1.0}
    mao_obra_nivel: {valor: baixa, cf: 1.0}
  bloqueadas: {}
