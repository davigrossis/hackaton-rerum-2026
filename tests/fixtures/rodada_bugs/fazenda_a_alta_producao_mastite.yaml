# Fazenda inventada A (#22, rodada de bugs cruzada): alta produção, médio prazo e mastite.
# Cobre o que os 5 casos conhecidos não disparam ponta a ponta: o par geral × exceção
# (R-IND-06 vence a R-IND-05) e a CCS fora da IN 76 (R-IND-08, R-CAU-06, R-REC-06, R-REC-07).
# Contas feitas à mão (todas conferidas em 2 casas decimais):
#   Mercado PR 09/2026 (dados/raw/PrecosMensalUF.txt, lido à parte com pandas):
#     preco_leite_uf = 2.81; preco_milho_uf = 0.98; preco_diesel_uf = 7.28
#     preco_leite_uf_media_12m = (2.58 + 2.53 + 2.34 + 2.28 + 2.15 + 2.16 + 2.17
#                                 + 2.52 + 2.60 + 2.60 + 2.76 + 2.81) / 12 = 2.4583
#     troca_leite_milho_uf = 2.81 / 0.98 = 2.8673 (> média de 12 meses: R-IND-07 não dispara)
#   IBGE PR, PPM 2025: 4800868 * 1000 / 1117187 / 365 = 11.7734 L/vaca/dia
#   receita_leite = 51300 * 2.85 = 146205.00
#   receita_total = 146205 + 3795 = 150000.00
#   custo_alimentar = 52000 + 30000 + 4000 = 86000.00
#   coe = 86000 + 15000 + 6000 + 5000 + 4000 = 116000.00
#   cot = 116000 + 12000 + 10000 = 138000.00
#   remuneracao_capital = 3000000 * 0.005 = 15000.00
#   ct = 138000 + 15000 = 153000.00
#   coe_por_litro = 116000 / 51300 = 2.26
#   cot_por_litro = 138000 / 51300 = 2.69
#   ct_por_litro = 153000 / 51300 = 2.98
#   margem_bruta = 150000 - 116000 = 34000.00
#   margem_liquida = 150000 - 138000 = 12000.00
#   lucro = 150000 - 153000 = -3000.00
#   Enquadramento Matsunaga (1976): COT (138000) <= Receita (150000) < CT (153000) -> medio_prazo
#   pct_vacas_lactacao = 60 / 72 * 100 = 83.33%
#   litros_vaca_dia = 51300 / (60 * 30) = 28.50 (> 25: exceção R-IND-06; > 11.77 do IBGE)
#   pct_alimentacao_coe = 86000 / 116000 * 100 = 74.14% (> 65: R-IND-05 e R-IND-06 em conflito)
#   pct_concentrado_receita = 52000 / 150000 * 100 = 34.67% (< 40: sem R-IND-04)
#   litros_ha = 51300 / 80 = 641.25
#   litros_dia_homem = 51300 / 30 / 5 = 342.00 (>= 150: sem R-IND-10)
#   preco_concentrado_kg = 52000 / 26000 = 2.00
#   preco_leite_relativo_uf = 2.85 / 2.81 = 1.01 (acima da UF: sem R-IND-01)
#   CF: R-IND-06 = 0.8; R-CAU-06 = 0.7 * 1.0 = 0.70;
#       R-REC-06 = 0.8 * 0.7 = 0.56; R-REC-07 = 0.8 * min(0.7, 1.0) = 0.56
# Médio prazo sem causa econômica: o custo alimentar é "adequado" pela exceção, e a única
# causa é a qualidade, que vale em qualquer situação.
id: alta_producao_mastite
nome: "Fazenda A — Alta produção com mastite (PR)"
