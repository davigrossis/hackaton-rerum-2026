  Fazenda no PR em 09/2026, 60 vacas em lactação a 28,5 L/vaca/dia. A alimentação pesa
  74% do COE, mas a produtividade justifica (exceção R-IND-06). Cobre o COT e não o CT
  (médio prazo). A CCS de 650 mil CS/mL passa do limite da IN 76.

