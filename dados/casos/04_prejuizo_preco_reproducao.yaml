# Caso 4: Fazenda em prejuízo (Receita Total < COE) por preço baixo + reprodução ruim.
# Contas feitas à mão (todas conferidas em 2 casas decimais):
#   receita_leite = 9000 * 2.50 = 22500.00
#   receita_total = 22500.00 + 0.00 = 22500.00
#   custo_alimentar = 6300 + 9500 + 1200 = 17000.00
#   coe = 17000 + 7500 + 2000 + 2000 + 1500 = 30000.00
#   cot = 30000 + 4000 + 5000 = 39000.00
#   remuneracao_capital = 800000 * 0.005 = 4000.00
#   ct = 39000 + 4000 = 43000.00
#   coe_por_litro = 30000 / 9000 = 3.33
#   cot_por_litro = 39000 / 9000 = 4.33
#   ct_por_litro = 43000 / 9000 = 4.78
#   margem_bruta = 22500 - 30000 = -7500.00
#   margem_liquida = 22500 - 39000 = -16500.00
#   lucro = 22500 - 43000 = -20500.00
#   Enquadramento Matsunaga (1976): Receita (22500) < COE (30000) -> prejuizo
#   Causas combinadas diagnosticadas:
#     1) Preço baixo: preco_leite_fazenda (R$ 2.50/L) < preco_leite_uf (R$ 3.04/L)
#        preco_leite_relativo_uf = 2.50 / 3.04 = 0.82 (17.8% abaixo da média estadual CONAB)
#     2) Falha reprodutiva grave: 30 vacas em lactação de um rebanho total de 50
#        pct_vacas_lactacao = (30 / 50) * 100 = 60.00% (alerta severo < 70-75%)
#        litros_vaca_dia = 9000 / (30 * 30) = 10.00 L/dia
#     3) Escala baixa (#12): litros_dia_homem = (9000 / 30) / 3 = 100.00 L/dia-homem,
#        abaixo do mínimo de 150 do CEPEA/Esalq (2012) para ordenha manual (R-IND-10)
#   Outros indicadores:
#   pct_alimentacao_coe = (17000 / 30000) * 100 = 56.67% (dentro de 40% a 65%)
#   pct_concentrado_receita = (6300 / 22500) * 100 = 28.00% (< 30-35%)
#   litros_ha = 9000 / 45 = 200.00 L/ha
#   litros_dia_homem = (9000 / 30) / 3 = 100.00 L/dia-homem
#   preco_concentrado_kg = 6300 / 4200 = 1.50 R$/kg
id: prejuizo_preco_reproducao
nome: "Caso 4 — Prejuízo por preço baixo e reprodução ruim"
descricao: >
  Propriedade em MG (09/2026) operando em prejuízo econômico e operacional imediato.
  O rebanho sofre de grave ineficiência reprodutiva com apenas 30 vacas em lactação
  e 20 secas (60,00% em lactação, com 40% do rebanho adulto improdutivo gerando custos
  de manutenção). A produção é de 9.000 L/mês (10 L/vaca/dia) e o produtor recebe apenas
  R$ 2,50/L (17,8% abaixo da cotação estadual CONAB de R$ 3,04/L). A receita bruta
  (R$ 22.500) é insuficiente para cobrir sequer os desembolsos diretos do mês (COE = R$ 30.000,
  margem bruta negativa de -R$ 7.500), fechando com prejuízo total de -R$ 20.500,00.

