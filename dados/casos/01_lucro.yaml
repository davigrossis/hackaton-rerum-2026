# Caso 1: Fazenda com lucro econômico (Receita Total >= Custo Total).
# Contas feitas à mão (todas conferidas em 2 casas decimais):
#   receita_leite = 30000 * 3.10 = 93000.00
#   receita_total = 93000.00 + 2000.00 = 95000.00
#   custo_alimentar = 21000 + 12000 + 2000 = 35000.00
#   coe = 35000 + 14000 + 3000 + 5000 + 3000 = 60000.00
#   cot = 60000 + 6000 + 8000 = 74000.00
#   remuneracao_capital = 1600000 * 0.005 = 8000.00
#   ct = 74000 + 8000 = 82000.00
#   coe_por_litro = 60000 / 30000 = 2.00
#   cot_por_litro = 74000 / 30000 = 2.47
#   ct_por_litro = 82000 / 30000 = 2.73
#   margem_bruta = 95000 - 60000 = 35000.00
#   margem_liquida = 95000 - 74000 = 21000.00
#   lucro = 95000 - 82000 = 13000.00
#   Enquadramento Matsunaga (1976): Receita (95000) >= CT (82000) -> lucro
#   Indicadores zootécnicos e de eficiência:
#   pct_vacas_lactacao = (50 / 60) * 100 = 83.33% (ideal: 80% a 85%)
#   litros_vaca_dia = 30000 / (50 * 30) = 20.00 L/dia
#   pct_alimentacao_coe = (35000 / 60000) * 100 = 58.33% (faixa saudável: 40% a 65%)
#   pct_concentrado_receita = (21000 / 95000) * 100 = 22.11% (ideal < 30% a 35%)
#   litros_ha = 30000 / 60 = 500.00 L/ha
#   litros_dia_homem = (30000 / 30) / 4 = 250.00 L/dia-homem
#   preco_concentrado_kg = 21000 / 14000 = 1.50 R$/kg
#   preco_leite_relativo_uf = 3.10 / 3.04 = 1.02 (acima da média da UF)
id: lucro
nome: "Caso 1 — Fazenda com lucro econômico"
descricao: >
  Propriedade eficiente em MG (09/2026) com rebanho de 50 vacas em lactação e 10 secas
  (83,33% em lactação), produzindo 30.000 L/mês (20 L/vaca/dia) com boa bonificação
  de preço (R$ 3,10/L contra média CONAB de R$ 3,04/L). Custos controlados com
  alimentação absorvendo 58,33% do COE. A receita bruta (R$ 95.000) cobre o COE (R$ 60.000),
  o COT (R$ 74.000) e a remuneração do capital investido (CT = R$ 82.000), gerando lucro
  econômico positivo de R$ 13.000,00 no mês.

