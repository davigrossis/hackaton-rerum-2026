# Caso 5: Fazenda com lucro e produtividade por vaca abaixo da média de MG no IBGE (#18).
# Contas feitas à mão (todas conferidas em 2 casas decimais):
#   produtividade_regional_ibge = 10070127 * 1000 / 2963271 / 365 = 9.3105 (PPM 2025, MG)
#   litros_vaca_dia = 7000 / (30 * 30) = 7.78 < 9.3105 -> R-IND-11 (e < 10 -> R-IND-03)
#   receita_total = 7000 * 3.10 + 300 = 22000.00
#   coe = (3000 + 2000 + 300) + 2000 + 400 + 500 + 300 = 8500.00
#   cot = 8500 + 1000 + 2000 = 11500.00
#   ct = 11500 + 200000 * 0.005 = 12500.00
#   lucro = 22000 - 12500 = 9500.00
#   Enquadramento Matsunaga (1976): Receita (22000) >= CT (12500) -> lucro
# Com lucro não há causa: a comparação com o IBGE não cria causa nem recomendação.
id: benchmark_ibge
nome: "Caso 5 — Produtividade abaixo da média de MG (IBGE)"
descricao: >
  Fazenda em MG, com lucro em 09/2026. A produtividade por vaca em lactação no mês
  fica abaixo da média estadual da PPM de 2025. A comparação é aproximada: um mês
  não mede o ano, e vacas em lactação no mês não equivalem às vacas ordenhadas no ano.

