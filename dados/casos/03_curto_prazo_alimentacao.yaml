# Caso 3: Fazenda em equilíbrio apenas de curto prazo por alimentação cara.
# Contas feitas à mão (todas conferidas em 2 casas decimais):
#   receita_leite = 18000 * 3.04 = 54720.00
#   receita_total = 54720.00 + 280.00 = 55000.00
#   custo_alimentar = 25000 + 10500 + 2000 = 37500.00
#   coe = 37500 + 7500 + 1500 + 2000 + 1500 = 50000.00
#   cot = 50000 + 5000 + 7000 = 62000.00
#   remuneracao_capital = 1000000 * 0.005 = 5000.00
#   ct = 62000 + 5000 = 67000.00
#   coe_por_litro = 50000 / 18000 = 2.78
#   cot_por_litro = 62000 / 18000 = 3.44
#   ct_por_litro = 67000 / 18000 = 3.72
#   margem_bruta = 55000 - 50000 = 5000.00
#   margem_liquida = 55000 - 62000 = -7000.00
#   lucro = 55000 - 67000 = -12000.00
#   Enquadramento Matsunaga (1976): COE (50000) <= Receita (55000) < COT (62000) -> curto_prazo
#   Indicadores zootécnicos e de eficiência:
#   pct_vacas_lactacao = (40 / 50) * 100 = 80.00% (ideal: 80% a 85%)
#   litros_vaca_dia = 18000 / (40 * 30) = 15.00 L/dia
#   pct_alimentacao_coe = (37500 / 50000) * 100 = 75.00% (sobrecusto alimentar severo > 68-70%)
#   pct_concentrado_receita = (25000 / 55000) * 100 = 45.45% (absorção excessiva da receita > 35-40%)
#   litros_ha = 18000 / 45 = 400.00 L/ha
#   litros_dia_homem = (18000 / 30) / 3 = 200.00 L/dia-homem
#   preco_concentrado_kg = 25000 / 12500 = 2.00 R$/kg
#   preco_leite_relativo_uf = 3.04 / 3.04 = 1.00 (na média da UF)
id: curto_prazo_alimentacao
nome: "Caso 3 — Curto prazo por alimentação cara"
descricao: >
  Propriedade em MG (09/2026) com 40 vacas em lactação e 10 secas (80% em lactação),
  produzindo 18.000 L/mês (15 L/vaca/dia) ao preço de mercado da CONAB (R$ 3,04/L).
  A receita total (R$ 55.000) cobre o COE (R$ 50.000, margem bruta +R$ 5.000), mas não
  cobre o COT (R$ 62.000, margem líquida -R$ 7.000). O diagnóstico aponta sobrecusto
  alimentar severo: a alimentação consome 75,00% do COE e o concentrado absorve 45,45%
  da receita bruta para uma produtividade moderada (15 L/vaca/dia).

